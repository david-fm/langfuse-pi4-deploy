# Langfuse self-host compose for Dockploy on Raspberry Pi 4 8GB.
#
# 9 services: zookeeper + clickhouse (Pi4 ARMv8.0) + postgres + redis +
# minio + minio-init + clickhouse-fix (DateTime64 migration) +
# langfuse-worker + langfuse-web (:3001).
#
# ClickHouse: builds from deploy/clickhouse-pi4/Dockerfile (ARMv8.0 compat).
# clickhouse-fix: one-shot ALTER TABLE to widen DateTime64(3)→DateTime64(6)
#   so langfuse worker's microsecond timestamps display correctly.
#   Re-runs on every deploy (idempotent, skips if already widened).
# MinIO: required by langfuse v3 OTel ingest (S3 write before queue).
#
# Pi 4 8GB sizing: ~1.5GB idle, ~3.7GB under load.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    build:
      context: ./clickhouse-pi4
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LANGFUSE_PG_DB:-langfuse}
      POSTGRES_USER: ${LANGFUSE_PG_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-langfuse_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_PG_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - langfuse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse-minio-dev}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://langfuse-minio:9000 ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse} ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse-minio-dev} &&
      mc mb local/${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse-events} --ignore-existing &&
      echo 'langfuse-events bucket ready.'
      "
    restart: "no"

  langfuse-clickhouse-fix:
    image: alpine:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache wget &&
        sh /fix.sh
    volumes:
      - ./clickhouse-pi4/fix-datetime-columns.sh:/fix.sh:ro
    environment:
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
      langfuse-clickhouse-fix:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD:-langfuse_pw}@langfuse-postgres:5432/${LANGFUSE_PG_DB:-langfuse}
      REDIS_URL: redis://langfuse-redis:6379
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      CLICKHOUSE_URL: http://${LANGFUSE_CLICKHOUSE_USER:-langfuse}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}@langfuse-clickhouse:8123/${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANGFUSE_CLICKHOUSE_USER:-langfuse}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}@langfuse-clickhouse:9000/${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse-events}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse-minio-dev}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
      SALT: ${LANGFUSE_SALT:-change-me-in-production-please-32-chars}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: info

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    ports:
      - "3001:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
      langfuse-clickhouse-fix:
        condition: service_completed_successfully
      langfuse-worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD:-langfuse_pw}@langfuse-postgres:5432/${LANGFUSE_PG_DB:-langfuse}
      REDIS_URL: redis://langfuse-redis:6379
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      CLICKHOUSE_URL: http://${LANGFUSE_CLICKHOUSE_USER:-langfuse}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}@langfuse-clickhouse:8123/${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANGFUSE_CLICKHOUSE_USER:-langfuse}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}@langfuse-clickhouse:9000/${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_pw}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse-events}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse-minio-dev}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
      SALT: ${LANGFUSE_SALT:-change-me-in-production-please-32-chars}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required (32+ char random)}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-malaria-sentinel}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-janus}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Janus}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Janus Admin}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: info

volumes:
  clickhouse_data:
  langfuse_pg:
  langfuse_redis:
  minio_data:
